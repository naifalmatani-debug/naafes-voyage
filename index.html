let N=31;const N0=31,HDR="<b>المملكة العربية السعودية<br>وزارة التعلم - إدارة تعليم الرياض<br>مدرسة ربيعة الرأي الابتدائية</b>";
// المحتوى: [مهارة، سؤال، خيارات(أ-د)، رقم الإجابة الصحيحة]
const M={
1:{t:"",q:[[0,"يغطي البحر ثلاثة أرباع سطح الكرة الأرضية فمنه نأخذ الطعام والملح والماء واللؤلؤ، فتطفو فوقه السفن وتنقل البضائع وتبحث الدول في باطنه عن الكنز الأغلى ثمنًا في العالم لاعتماد أغلب الآلات والصناعات عليه. ما مرادف كلمة (تطفو)؟",["تقوم","تحوم","تعوم","تلوم"],2],
[0,"تعد التجارة من أسباب نماء المال. ما مضاد كلمة (نماء)؟",["الزيادة","الادخار","النقصان","العطاء"],2],
[0,"ومعرفة ثقافة الشعوب تذلل عقبات كبيرة في طريقة التواصل بينها. ما معنى كلمة (تذلل)؟",["تصعب","تسهل","تخضع","تخبر"],1]]},
2:{t:"",q:[[1,"يتكون العالم من شعوب عديدة، ولكل شعب عاداته وتقاليده ولغته التي يتواصل بها وتسمى بثقافة الشعوب، ومعرفة ثقافة الشعوب تذلل عقبات كبيرة في طريقة التواصل بينها كما أن الاطلاع على الثقافات يكسبنا خبرات متنوعة ويحقق السلام بين الشعوب. ماذا نستفيد من التواصل مع ثقافة الشعوب؟",["السلام","الأمان","الحروب","الخوف"],0],
[1,"أقامت المدرسة حفلة كبيرة بمناسبة اليوم العالمي للغة العربية، وكان احتفالًا رائعًا، حيث وضعت لافتات وعبارات تتحدث عن روعة لغتنا العربية واشتملت الحفلة كذلك على عروض للفنون والخطوط العربية وحكايات من التراث العربي الأصيل. كان من ضمن فقرات الحفل:",["نصوص شعرية","مسابقات أدبية","رياضة","قصص"],3],
[1,"يغطي البحر ثلاثة أرباع سطح الكرة الأرضية. فما هي مساحة اليابسة على سطح الكرة الأرضية؟",["ثلث","ربع","خمس","سدس"],1]]},
3:{t:"أوصى حكيم ابنه قائلًا: أي بني، اعلم أن الإنسان معرض للخطأ صغيرًا كان أو كبيرًا، عالمًا أو جاهلًا، وهذا الخطأ قد يؤدي غيره إلى سوء العاقبة وانفصام عرى المودة بين الناس، لذا حثنا الإسلام على تحري الصواب في أقوالنا وأفعالنا وحذرنا من ارتكاب ما يوقعنا في مواطن الحرج ولأن الإنسان خطاء بطبعه فقد قال رسولنا صلى الله عليه وسلم (كل ابن آدم خطاء، وخير الخطائين التوابون) وهو الذي أمر أبا ذر الغفاري أن يعتذر لبلال بن رباح حين عيره قائلًا: يا ابن السوداء فما كان من أبي ذر إلا أن وضع خده على الثرى طالبًا من بلال أن يطأه بقدمه عسى أن يكفر بذلك عن زلته.",q:[
[2,"ما الفكرة العامة للنص؟",["الاعتذار عند الخطأ","تجاهل الاعتذار","تبرير الخطأ","الإصرار على الخطأ"],0],
[2,"وقوع الخطأ قد يؤدي إلى:",["إيجاد روابط جديدة","توثيق روابط قديمة","تحديث الروابط الأخوية","قطع الروابط الأخوية"],3],
[0,"ما معنى كلمة (الثرى)؟",["التراب","الحصى","العشب","الغبار"],0],
[1,"تطلق كلمة (خطاء) على من يخطئ:",["أحيانا","قليلا","كثيرا","نادرا"],2],
[1,"ماذا فعل أبو ذر رضي الله عنه بعد أمر رسول الله صلى الله عليه وسلم له؟",["استجاب للأمر","ترك الأمر","خرج من المكان","الإصرار على الخطأ"],0],
[1,"لماذا حثنا الإسلام على تحري الصواب في الأقوال والأفعال؟",["لنتتبع الخطأ","لنتقبل الخطأ","لنقع في الخطأ","لنسلم من الخطأ"],3],
[0,"ما معنى كلمة (زلته)؟",["خطؤه","اعتذاره","صوابه","فعله"],0],
[0,"ما مرادف كلمة (الحرج)؟",["الاعتزاز","الراحة","الضيق","الفخر"],2],

4:{t:`اتخذنا السيارة ركوبة لنا في سفرنا إلى مدينة تبوك فأخذت تنهب الطريق الصحراوي وتطويه طيا، ما أجمل هذه الصحاري العربية الممتدة التي كساها الله صفرة الذهب الأصفر، ومنحها خيرات الذهب الأسود الذي تفجر في جنباتها، ووهب الله أهل هذه البلاد السكينة والطمأنينة والفلاح لمجاورتهم أقدس البقاع وأطهرها قبلة المسلمين ومهوى أفئدة العالمين. حمدنا الله على نعمائه، إذ حول المهندسون والعمال السلاسل المتصلة من الرمال طرقا معبدة عبر الصحراء الممتدة وجعلوها سالكة بكل يسر وسهولة، وكنا ننظر أمامنا على طول الطريق فظننا السراب ماء وحسبنا الطريق أمامنا نهرا جاريا من المياه، وباقترابنا من مدينة تبوك، حاضرة الشمال الغربي، ألفينا خضرة النخيل معانقة زرقة الأفق، ووجدنا رشاشات المياه نافذة مياهها العذبة التي تحول الصحراء جنات يانعة ومزارع خضراء نضرة وأخيرا وصلنا إلى تبوك الورد، فإذا هي مدينة كبيرة، تعج بالحياة والحركة، أعجبتنا شوارعها الواسعة، عمرانها المزدهر ومزارعها التي تحيط إحاطة السوار بالمعصم، تقيها غبار الصحراء ورمالها هذه المزارع التي جعلت تبوك جنة مترامية الأطراف تزود المملكة بشتى أنواع الخضار والفواكه، فإذا قلنا عنها ما قلنا فلن نوفيها حقا في الوصف، فهي بيئة جميلة جمعت الصحراوي، والسلاسل الجبلية والموائد الصحراوية، وجمال الورد وخضرة المزارع ناهيك عن التطور العمراني والحضاري في شتى الميادين.`,q:[

6:{t:`دخل الطفل على والده الذي أنهكه العمل، فمن الصباح إلى المساء وهو يتابع مشاريعه وأعماله، فليس لديه وقت للمكوث في البيت إلا للأكل أو النوم. الطفل: لماذا يا أبي لم تعد تلعب معي وتقول لي قصة، فقد اشتقت لقصصك واللعب معك، فما رأيك أن تلعب معي اليوم قليلا وتقول لي قصة؟ الأب: يا ولدي أنا لا وقت لدي للعب وضياع الوقت، فعندي من الأعمال الشيء الكثير ووقتي ثمين. الطفل: أعطني فقط ساعة من وقتك يا أبي. الأب: يا ولدي الحبيب أنا أعمل وأكدح من أجلكم، والساعة التي تريدني أن أقضيها معك أستطيع أن أكسب فيها ما لا يقل عن مئة ريال، فلا وقت لدي لأضيعه معك، هيا اذهب والعب مع أمك. تمضي الأيام ويزداد انشغال الأب، وفي أحد الأيام يرى الطفل باب المكتب مفتوحا فيدخل على أبيه. الطفل: أعطني يا أبي خمسة ريالات. الأب: لماذا؟ فأنا أعطيك كل يوم فسحة خمسة ريالات، ماذا تصنع بها؟ ... هيا اغرب عن وجهي، لن أعطيك الآن شيئا. يذهب الابن وهو حزين، ويجلس الأب يفكر فيما فعله مع ابنه، ويقرر أن يذهب إلى غرفته لكي يرضيه، ويعطيه الخمسة ريالات. ففرح الطفل بهذه الريالات فرحا عظيما، وتوجه إلى سريره ورفع وسادته وجمع النقود التي تحتها، وبدأ يرتبها! عندما تساءل الأب في دهشته قائلا: كيف تسألني وعندك كل هذه النقود وتطلب مني المزيد؟ قال الطفل: كنت أدخر مصروفي كل يوم لأجمع مئة ريال مقابل ساعة من وقتك لتقضيها معي، والآن خذ يا أبي النقود وأعطني ساعة من وقتك.`,q:[

7:{t:`كرم الله سبحانه وتعالى الجمل، ودعانا إلى التفكر فيه فقال (أفلا ينظرون إلى الإبل كيف خلقت) فخلق الإبل آية من الآيات الدالة على عظمة الخالق سبحانه وتعالى، وقد ارتبطت الإبل بالإنسان العربي ارتباطا وثيقا، وكانت جزءا مهما في كل تفاصيل حياته، والعكس هذا الارتباط على فنه وأدبه، وقد سمى الله الجمل في القرآن بعدة أسماء، منها: الإبل، والناقة، والبعير، والعشار. وفي السنة النبوية ورد ذكرها أكثر من مئة مرة، إذ مدحها الرسول صلى الله عليه وسلم مرة فقال: (الإبل عز لأهلها) وعندما رأى عليه الصلاة والسلام جملا هزيلا بسبب قلة اهتمام أصحابه به قال: اتقوا الله في هذه البهائم المعجمة، فاركبوها صالحة، وكلوها صالحة. وأما الشعراء والأدباء فقد مدحوا صبر الجمال وتحملها مشاق السفر، واتخذها بعضهم رفيقا، ووصفها بالصفات الإنسانية، وخاصة الشعراء الذين نظموا القصائد التي تصف طباعها، وارتباط الناس بها ومنزلتها عندهم. ولأن الإبل جزء أساسي من حياة الإنسان العربي، فقد ضرب بها مئات الأمثال استخداما قولنا: "ما هكذا تورد الإبل" أي ليس بهذه الطريقة يكون القيام بالأمر، وإذا أردنا أن نعبر عن مجيء الجميع وعدم تخلف أحد منهم نقول: "جاؤوا على بكرة أبيهم" والبكرة هي النار الصغيرة. والغريب أن الجمل اسم من أسماء كثيرة لهذا الحيوان، ويطلق على الذكر فقط إذا بلغ أربعة أعوام، بينما تسمى الأنثى "ناقة". أما الاسم العام الذي يطلق على الذكور والإناث معا فهو اسم "الإبل" ومن الشائع تسمية ذكر الإبل بعيرا.`,q:[

9:{t:`يقول الحكماء: (العقل السليم في الجسم السليم) / من هنا جاء اهتمام الإنسان منذ القدم بالرياضة، فقد كان الصينيون القدماء من أوائل الذين استخدموا الرياضة وسيلة علاجية، وكانوا يعدونها نظاما تربويا لحياتهم. أما الهنود فقد اهتموا بالرياضات التي تعتمد على الصبر فمارسوا ركوب الخيل والفيلة والمصارعة. واهتم الفراعنة بها؛ لأنها جزء من التعاليم الدينية عندهم، وعدوا اللياقة البدنية شرطا من شروط الحكم. كما اهتم الفرس والرومان بالتربية البدنية بدافع عسكري؛ لإعداد الأولاد ليكونوا محاربين؛ فاتسمت رياضتهم بالقوة والعدوانية والقسوة. وقد حملت رسالة الإسلام توازنا بين الجسد والعقل والنفس؛ فحثت على الاهتمام بالجسد، إذ إن الإنسان يسأل أمام ربه عن صحته. واهتم الصحابة ـ رضوان الله عليهم ـ بالرياضة، لاسيما الجري والسباحة وركوب الخيل والنبال؛ لما فيها من فوائد بدنية وصحية تتماشى مع روح الإسلام وتعاليمه التي تعنى بتربية الجسوم والعقول والنفوس. للرياضة أنواع كثيرة منها: المشي، والجري، ورفع الأثقال، والألعاب الكروية المختلفة، والسباحة، وركوب الخيل، والمصارعة، والتزلج ...... إذ يمكن للإنسان أن يختار منها ما يناسب قدرته وعمره وظروفه الخاصة. وللرياضة فوائد جمة لصحة الجسد، منها ما نعلمه ومنها ما نجهله، ومن هذه الفوائد أنها تبقي القلب في حالة نشاط دائم، وكلما مارس الإنسان الرياضة ازداد ضخ الجسم المحمل بالأكسجين والغذاء إلى جميع أنحاء جسمه، وهذا مهم لمرضى القلب؛ لحمايتهم من جلطات الشريان التاجي، والرياضة تعمل على تقوية العضلات، وتؤخر أعراض الشيخوخة، ومثال ذلك أننا نشاهد أشخاصا معمرين ولا يعانون من أية أمراض، علما أن أعمارهم قد جاوزت عقدها الثامن، كما أن الرياضة تقوي العظام وتحمي من هشاشتها، بالإضافة إلى ذلك فإن الرياضة والسمنة ضدان لا يجتمعان؛ فالرياضة تحافظ على الرشاقة؛ لأنها تحرق الدهون، وتشد الجسم وتحافظ على الوزن المناسب للإنسان.`,q:[

10:{t:`دأب الإنسان عبر مسيرة تطوره الحضاري على توفير سبل الراحة والأمان في وسائل النقل والمواصلات، فأعمل عقله ليوفر الوقت والمال والجهد، فانفتحت أمامه آفاق جديدة من الإبداعات المتجددة التي توفر الرفاهية والتكنولوجيا لمركبته الخاصة.

ورغم هذه الإنجازات العظيمة إلا أن الإنسان لم يتمكن بعد من الحد من دور وسائل النقل في إزهاق الأرواح وإلحاق الإصابات الجسدية المتنوعة التي تقض مضاجع الكثيرين وتحرم آلاف البشر الحياة، وما يترتب على ذلك من هدر وخسارة للممتلكات، فتشكل سيفا آخر مسلطا على الرقاب، دون أن نعلم متى تكون المركبة معول راحة للإنسان؟ ومتى تكون معول قتل له أو تقويض لحياته؟ إن المسؤولية العظمى تقع على عاتق الشباب للحد من هذه الحوادث، وتقليل الأضرار الناتجة عنها لأنهم الشريحة الكبرى، إذ يجب التزام سبل الوقاية من الحوادث قبل وقوعها، عملا بالحكمة القائلة: درهم وقاية خير من قنطار علاج.

ولابد في سبيل ذلك التأكد من صلاحية المركبة ميكانيكيا، وأهليتها للسير على الشوارع، وحيازتها للأوراق الثبوتية السليمة قبل ركوبها وحيازة السائق لرخصة تؤهله لقيادة المركبة، ويبقى على السائق التأكد من وضع حزام الأمان له وللركاب معه، ومراعاة ظروف الطريق، والتزام اللوحات الإرشادية، والحفاظ على القوانين والأنظمة المرورية التي تحفظ له ولغيره السلامة والأمان وتضمن له العودة السالمة لأسرته، كما أن على السائقين تمثيل أخلاقيات القيادة، فهي فن وذوق وأخلاق.

إن الحياة أغلى من أن تهدر في لحظة تهور، فلنحافظ عليها. لتكن مركباتنا آلة بناء وطني وإنساني تحملنا إلى شاطئ الأمان، لا إلى ضفاف الألم والحرمان.`,q:[
[1,"يسعى الإنسان لتوفير سبل الراحة والأمان في تنقله؛ لتوفير الوقت والجهد والمال. العبارة السابقة تلخص:",["الفقرة الأولى","الفقرة الثانية","الفقرة الثالثة","الفقرة الرابعة"],0],
[3,"ما المقصود بالصورة الجمالية التالية: (لتشكل سيفا مسلطا على الرقاب)؟",["حوادث السير كالسيف المسلط على الرقاب","قطع الطريق كالسيف المسلط على الرقاب","السرعة الزائدة كالسيف المسلط على الرقاب","الأنظمة المرورية مثل السيف المسلط على الرقاب"],0],
[3,"(درهم وقاية خير من قنطار علاج) علام تدل العبارة السابقة؟",["المال خير من العلاج","الوقاية بعد وقوع الضرر","الوقاية قبل وقوع الضرر","إغفال ربط حزام الأمان"],2],
[0,"ما معنى كلمة (حيازة)؟",["امتلاك","ترك","رفض","قبول"],0],
[1,"كيف تكون مركباتنا آلة بناء وطني وإنساني؟",["الاهتمام بالسيارات والآلات","بناء المنظمات الإنسانية","تطبيق الأنظمة المرورية","الدفاع عن الوطن"],2],
[8,"وأنت تقود سيارتك وقع أمام نظرك حادث مروري، ما سببه باعتقادك؟",["انتهاء سريان رخصة القيادة","إغفال ربط حزام الأمان","تأخر الشخص عن موعده","قطع الإشارة الحمراء"],3],
[1,"من الثقافة الحديثة لأخلاقيات القيادة:",["الإجبار على الأنظمة المرورية","حقوق القيادة مالي وما علي","الخوف من السجن","الاحتراز من الغرامة المالية"],1],
[3,"إذا كنت تريد تصميم لافتة مرورية تخاطب بها الآباء، فما العبارة المناسبة لهم؟",["أسرتك بانتظارك","انتبه للإشارة الحمراء","لا تهورا يا أبي","لا تخسر حياتك في دقيقة"],2],
[2,"تحدثت الفقرة الثانية من النص عن:",["الإنجازات العظيمة للإنسان","سبل الراحة والأمان للمركبات","الأضرار المادية","القواعد والأنظمة المرورية"],2]]},
11:{t:"",q:[
[0,"تهدف مبادرة السعودية الخضراء إلى حماية البيئة وتعزيز الوعي البيئي من أجل الإسهام في الجهود المبذولة لمكافحة التصحر. ما مرادف كلمة (مبادرة)؟",["مسارعة","استجابة","مشاركة","معاونة"],0],
[0,"الهدف من تنمية الغطاء النباتي تقليل الانبعاثات الكربونية. ما مضاد كلمة (الانبعاث)؟",["إطلاق","انتشار","زوال","اندفاع"],2],
[0,"تهدف مبادرة السعودية الخضراء إلى حماية البيئة وتعزيز الوعي البيئي من أجل الإسهام في الجهود المبذولة لمكافحة التصحر. ما معنى كلمة (الوعي)؟",["الحفظ","الفهم","القبول","التدبر"],1],
[0,"١- سعيا لتحقيق رؤية المملكة العربية السعودية ٢٠٣٠، واغتناما للدور الريادي للمملكة في القضايا البيئية وأسباب التغير المناخي. ٢- رؤية الطريق واضحة. ٣- لديك رؤية حادة للأمور. معنى رؤية حسب السياق على التوالي:",["الأهداف والخطط، المشاهدة، إدراك حاد وحكم سليم","المشاهدة، الأهداف والخطط، إدراك حاد وحكم سليم","الأهداف والخطط، إدراك حاد وحكم سليم، المشاهدة","إدراك حاد وحكم سليم، المشاهدة، الأهداف والخطط"],0],
[0,"ما معنى التصحر في عبارة: (من أجل الإسهام في الجهود المبذولة لمكافحة التصحر)؟",["مكافحة الحرارة الشديدة والجفاف","مكافحة تعرض الأرض للتدهور في المناطق القاحلة","مكافحة امتداد الغطاء النباتي","مكافحة امتداد الغابات والعمل على إزالة الأشجار"],1]]},
12:{t:"",q:[
[9,`"شخص لا أعرفه، أرسل لي تحية، وقال: إنه يريد أن يصبح صديقي. قطبت أمي حاجبيها، ثم أغلقت الحاسوب وقالت: تعال لنتكلم قليلا". الأسلوب الذي اعتمد عليه الكاتب في عرض أحداث القصة هو:`,["السرد","الحوار","التمثيل","الوصف"],1],
[9,`"قالت الأم لابنها الذي قضى وقتا يلعب باستخدام الحاسوب: أنت تعرف القواعد، لا واجبات يعني لا حاسوب" يدل قول الأم على:`,["القسوة","الفوضى","التهديد","العناية"],3],
[9,`"أخذني حديثه الساحر الذي واصله بأسلوبه الجميل فلقد كان نعم المتحدث" معنى عبارة (أخذني حديثه الساحر):`,["سخرت منه وضحكت","فرحت وسعدت","استمالني للاستماع إليه بإعجاب","منعني من الكلام بصوت مسموع"],2],
[9,`يقول الشاعر: "بلادي أحبك فوق الظنون وأشدو بحبك في كل نادي / عشقت لأجلك كل جميل وهمت لأجلك كل جميل". الفكرة الرئيسة في الأبيات التي مطلعها البيت السابق هي:`,["البعد عن الظنون","حب الشاعر لبلاده","حب الشاعر لكل ما هو جميل","يشدو الشاعر بحبه في كل نادي"],1],
[9,`"الروماتيزم مصطلح يستخدم لوصف الألم والالتهاب في المفاصل، والعضلات، والأنسجة الرخوة المحيطة والمعروفة باسم النسيج الضام، حيث تعتبر كلمة الروماتيزم كلمة مشتقة من الكلمة اليونانية روماتيزموس، وتعني السيولة أو الرشح، أي رشح المفاصل، وتعني بالعربية الأمراض الرثية أو الروية، وهي فرع من تخصص الأمراض الباطنية". المقصود بمرض الروماتيزم:`,["كلمة يونانية","الأنسجة الرخوة","كلمة عربية","التهاب وألم المفاصل"],3]]},
13:{t:"",q:[
[9,"على أحد الجبال القريبة من مكة وفي غار حراء كان محمد صلى الله عليه وسلم يخلو بنفسه ويفكر في خالق الكون الكبير، وذات يوم بينما كان محمد صلى الله عليه وسلم في الغار أتى إليه ملك وضمه إليه وقال له: اقرأ. فوجئ محمد صلى الله عليه وسلم وتعجب لطلبه وقال له: ما أنا بقارئ. وكرر الملك قوله ثلاث مرات وفي المرة الثالثة قال لمحمد صلى الله عليه وسلم: (اقرأ باسم ربك الذي خلق) سورة العلق. نفذ محمد صلى الله عليه وسلم ما طلبه الملك، وأعاد قراءة ما سمع وهو يرتجف خوفا واختفى الملك. غادر محمد صلى الله عليه وسلم الغار مسرعا إلى زوجته خديجة رضي الله عنها وطلب منها أن تغطيه بالثياب، غطت خديجة زوجها بالثياب ودهشت وهي تراه يرتجف فسألته عما جرى له. ما الذي جرى لمحمد صلى الله عليه وسلم في غار حراء؟",["أتى إليه ملك وطلب منه أن يقرأ","أتى إليه ملك وضمه وقال له: اقرأ","كان يخلو بنفسه ويفكر في غار حراء","يخلو بنفسه في غار حراء وجاء إليه الملك"],1],
[2,"الفكرة الفرعية في النص:",["نزول الوحي على الرسول عليه الصلاة والسلام","القلق والتردد الذي شعر به الرسول عليه الصلاة والسلام عند تلقيه الوحي","التجربة الروحية العميقة التي عاشها الرسول عليه الصلاة والسلام في غار حراء","بداية الوحي إلى النبي محمد صلى الله عليه وسلم شكلت نقطة تحول تاريخية في الدعوة الإسلامية"],1],
[0,`"غطت خديجة زوجها بالثياب ودهشت وهي تراه يرتجف فسألته عما جرى له". الجملة التي فيها كلمة مشابهة في المعنى لكلمة (دهشت) هي:`,["حزنت الفتاة عندما لم تتمكن من حضور حفل تخرج أختها","خافت الطفلة من صوت الرعد القوي","غضبت الأخت للعبث بممتلكاتها","ذهلت الفتاة من جمال المنظر الطبيعي"],3],
[3,`"ما أنا بقارئ"، عبارة جمالية موجزة تدل على:`,["رفض القراءة","الاعتراف بعدم القدرة على القراءة لأنه أمي","التواضع","الضعف"],1],
[3,`"فسألته عما جرى له" رأيك في سؤال السيدة خديجة لزوجها محمد صلى الله عليه وسلم:`,["يعكس قلقها وحرصها على دعم زوجها في اللحظات العصيبة","يظهر كيف كانت السيدة خديجة رمزا للثبات والقوة في أوقات الأزمات","إجابة (أ) و(ب) صحيحتان","الإجابة الصحيحة هي (أ) فقط"],2]]},
14:{t:`يحكى أن أهل إحدى القرى الصينية الفقيرة الواقعة على مصب أحد الأنهار كانوا يعيشون على صيد الأسماك، فاجتمعوا ذات ليلة وأجمعوا أمرهم على الرفع للحكومة بإنشاء مصنع للمطاط وخصوصا أن قريتهم تتميز بكثافة غابات المطاط فوافقت الحكومة على إنشاء مصنع كبير للمطاط يقع على ضفاف النهر، فاستبشر الناس خيرا لهذا المشروع الذي لن يدع فقيرا في قريتهم إلا أغناه وما إن بدأ المصنع في العمل حتى أخذ يتخلص من نفاياته ومخلفاته الكيماوية في مياه النهر فتلوثت الحياة البحرية فنفق ما فيها من أسماك، وتبددت سحائب فرحتهم، وخيم الحزن عليهم، وتحولت فرحتهم الغامرة إلى حزن عميق؛ إذ فقدوا موردا من موارد طبيعتها فالنهر ملوث، والأسماك مسمومة.`,q:[
[1,"ما سبب تذمر أهالي القرية من مصنع المطاط عندما بدأ عمله:",["تلوث بيئتهم","هطول الأمطار","كثرة الأسماك","تلوث ملابسهم"],0],
[0,`في النص السابق وردت كلمة (نفق) في عبارة "فتلوثت الحياة البحرية فنفق ما فيها من أسماك". الجملة التي فيها مرادف كلمة (نفق) هي:`,["جاء المساء بألوانه الهادئة","قفز اللاعب عاليا ليحرز الهدف","الأسد مات بعد صراع طويل مع المرض","كبر الفتى وأصبح شابا"],2],
[7,"هل يجب علينا أن نستغني عن المصانع في حياتنا اليومية؟ اختر الحجة القوية مما يلي:",["نعم؛ لأنها تلوث البيئة","لا؛ لأنها أساس تقدم المجتمعات","نعم؛ لأنها تطرح مخلفاتها في مياه البحار","لا؛ لأنها تساعد في توظيف عدد من المواطنين"],1],
[0,`في النص السابق وردت كلمة (ضفاف) في عبارة "مصنع كبير للمطاط يقع على ضفاف النهر". الجملة التي فيها ضد كلمة (ضفاف) هي:`,["اقتربت من حافة الجرف بحذر","أمسك الطفل بطرف الثوب","جلسنا نستمتع بالغروب على الشاطئ","وضعت الطاولة في وسط الحديقة"],3],
[1,"يهدف كاتب القصة إلى:",["رفض الصناعة الكيماوية لضررها على الطبيعة","التوسع في الصناعات الكيماوية","ضرورة المحافظة على البيئة من الملوثات وعدم المساس بها","الدعوة إلى عدم التنوع في موارد العيش"],2]]},
15:{t:`في أحد الليالي زمجرت الرياح؛ فقفز صاحب المزرعة منزعجا من فراشه، ثم أخذ مصباحا واندفع بسرعة إلى الحجرة التي ينام فيها العامل النحيل الذي عينه للعمل عنده في المزرعة، ثم راح يهز الرجل وهو يصرخ بصوت عال: "استيقظ فهناك عاصفة آتية قم فثبت كل شيء واربطه قبل أن تطيره الرياح". استدار العامل النحيف مبتعدا في فراشه وقال في حزم: "لا يا سيدي؛ فقد سبق وقلت لك أنا الذي ينام عندما تعصف الرياح!" استشاط صاحب المزرعة غضبا من ردة فعله، وعزم على طرده في الصباح، وبدلا من أن يضيع الوقت خرج مستعجلا؛ ليستعد لمجابهة العاصفة. وعندما وصل أصابته الدهشة! من عظيم صنيعه: فقد اكتشف أن كل الحظائر مغطاة بمشمعات، والبقر في الحظيرة، والطيور في أعشاشها، والأبواب عليها أسياخ حديدية، وجميع النوافذ محكمة الإغلاق، وكل شيء مربوط جيدا ولا شيء يمكن أن يطير. وحينذاك فهم صاحب المزرعة ما الذي يعنيه ذلك العامل، وعاد إلى فراشه لينام بينما الرياح كانت تعصف.`,q:[
[2,"(اتخذ صاحب العمل قرار طرد العامل في الصباح) الذي جعل صاحب العمل يغير رأيه ويعدل عنه كما فهمت من النص:",["إهمال العامل وتكاسله","أمانة العامل في عمله","نوم العامل","عدم إحساس صاحب المزرعة بالرضا عن العامل"],1],
[3,"ورد في النص عبارة (زمجرت الرياح) رأيك في العبارة:",["عبارة مناسبة، أعطت النص قوة","عبارة غير مناسبة، أضعفت المعنى","عبارة غير مناسبة، لا تناسب المعنى","عبارة مناسبة، تناسب صوت عامل المزرعة"],0],
[2,"جميع ما يأتي تناوله النص السابق ما عدا:",["الراتب الذي كان يتقاضاه العامل أجرة عمله في المزرعة","موقع المزرعة","رفض العمال العمل بالمزرعة","المزرعة بها حظائر بقر وأعشاش طيور"],0],
[2,"يهدف كاتب القصة إلى:",["أن مواصفات العامل النشيط يلزمه أن يكون قصير القامة نحيل الجسم","الأمانة في العمل تزرع ثقة النفس","تحذير من إقامة المزارع على الشواطئ","حماية المحاصيل والحيوانات من العواصف"],1],
[2,"من الأفكار الفرعية الواردة في النص:",["الأمانة في العمل تزرع ثقة النفس","مراقبة الله في الأعمال","صفات العامل الجسمية","التوكل على الله مع الأخذ بالأسباب"],2]]},
16:{t:`اتخذنا السيارة ركوبة لنا في سفرنا إلى مدينة تبوك فأخذت تنهب الطريق الصحراوي، وتطويه طيا، ما أجمل هذه الصحاري العربية الممتدة! التي كساها الله صفرة الذهب الأصفر، ومنحها خيرات الذهب الأسود الذي تفجر في جنباتها، ووهب الله أهل هذه البلاد السكينة والطمأنينة والفلاح؛ لمجاورتهم أقدس البقاع وأطهرها قبلة المسلمين ومهوى أفئدة العالمين. باقتراب ابنا من مدينة تبوك، حاضرة الشمال الغربي، ألفينا خضرة النخيل معانقة زرقة الأفق، ووجدنا رشاشات المياه نافذة مياهها العذبة التي تحول الصحراء جنات يانعة، ومزارع خضراء نضرة. وصلنا إلى تبوك الورد.`,q:[
[5,"وهب الله أهل هذه البلاد السكينة والطمأنينة والفلاح بسبب:",["لأن فيها الصحراوي الممتدة","لأن فيها خضرة النخيل المعانقة زرقة الأفق","فيها رشاشات المياه النافذة مياهها العذبة","لمجاورتها أقدس البقاع وأطهرها"],3],
[5,"الآية المناسبة الداعمة لأحد المشاهد الواردة في النص هي:",["قال تعالى {والذين كفروا أعمالهم كسراب بقيعة يحسبه الظمآن ماء حتى إذا جاءه لم يجده شيئا ووجد الله عنده فوفاه حسابه والله سريع الحساب}","قال تعالى {الخيل والبغال والحمير لتركبوها وزينة}","قال تعالى {وسارعوا إلى مغفرة من ربكم وجنة عرضها السماوات والأرض أعدت للمتقين}","قال تعالى {واضرب لهم مثل الحياة الدنيا كماء أنزلناه من السماء فاختلط به نبات الأرض فأصبح هشيما}"],1],

17:{t:`في يوليو عام ١٩٦٩، قامت وكالة الفضاء الأمريكية (ناسا) بتنفيذ رحلة تاريخية إلى القمر، وتُعدّ هذه الرحلة ملحمة علمية واستكشافية مذهلة. انطلقت مركبة الفضاء (أبولو ١١) من الأرض محمّلة بثلاثة رواد فضاء: نيل أرمسترونغ، وباز ألدرين، ومايكل كولينز. استغرقت الرحلة عدة أيام، تخطّت خلالها المركبة المسافة الهائلة بين الأرض والقمر. وفي ٢٠ يوليو هبطت المركبة على سطح القمر، وعندما فتح نيل أرمسترونغ الباب أصبح أول إنسان يخطو بقدمه على سطحه، قائلًا: «هذه خطوة صغيرة للإنسان، ولكنها قفزة عملاقة للبشرية». قام رواد الفضاء بجمع العينات الصخرية وإجراء تجارب علمية مهمة، وكانت المهمة مليئة بالتحديات.`,q:[

18:{t:"",q:[
[4,`تجاربهم في القراءة: لا أتخيل الدنيا دون كتاب، أو بالأحرى دون ثقافة مطبوعة، ولا أتصور العالم بدون حبر المطابع، وعطر الحبر، وليست هذه نظرة ليبقي أن ثقافة الكتاب أمتع وأيسر وأبقى. أليس الكتاب كما قال الجاحظ (كاتب عباسي) "يفيدك ولا يستفيد منك، إن جد فعبرة، وإن مزح فنزهة". وصف صاحب التجربة (الدنيا دون كتاب أو دون ثقافة مطبوعة):`,["وصفها بأنها (لا يمكن تخيلها)","وصفها بأنها (أيسر وأبقى)","وصفها بأنها (أكثر متعة)","وصفها بأنها (عبرة ونزهة)"],0],
[4,"تجاربهم في القراءة: القراءة ليست تزجية وقت أو مزاج ترف، وإنما هي تجارب حياة. إن الكتب خزائن لمفكرين وحكماء أبلوا في الحياة ونقلوا تجاربهم لنا؛ نفيد منها في حياتنا وسلوكنا. فالقراءة ليست جمع معلومات فقط، بل يجب أن تستفيد مما تقرؤه في خدمة وطنك، والتواصل مع مجتمعك. وصف صاحب التجربة القراءة بأنها:",["القراءة مزاج ترف وتزجية وقت","القراءة من الكتب خزائن لجمع المعلومات فقط","القراءة تجارب نفيد منها أنفسنا ووطننا ومجتمعنا","القراءة ليست تجارب حياة وقضاء وقت"],2],
[3,"لغة الخلود: أجيبي لهفة الأشواق فضي ختام المسك عن سر الكتاب / وقولي: كيف تنتفض القوافي لتحكي عنك عن درر العتاب. حدد القيمة التي سعى الشاعر إلى غرسها في هذا النص من بين القيم الآتية:",["الدفاع عن اللغة العربية وحمايتها","مقارنة اللغة العربية بغيرها من اللغات","حب اللغة العربية والاعتزاز بها","تفوق اللغة العربية على اللغات الأخرى"],2],
[3,"قال الشاعر: ويا لغة الخلود وأنت أرض يرتل في خشوع واحتساب / وأنت مداد آي الله تتلى فيخبت نافر ويثوب كابي. أبد/ي رأيك في وصف الشاعر للغة العربية بأنها (لغة الخلود) مع ذكر السبب:",["رأي خاطئ فهي ليست لغة خالدة","رأي خاطئ فجميع اللغات ليست باقية","رأي صائب فهي لغة العرب","رأي صائب لأنها باقية فهي لغة القرآن الكريم"],3]]},
19:{t:`ألقيت بجسمي على السرير الوثير، وأنا أمني نفسي بنومة هادئة. لم يمض إلا لحظات قليلة حتى أحسست براحة تامة، فأغمضت عيني، لعلي أسافر كل ليلة؛ إلى عالم الأحلام الجميلة. وفي لمح البصر، نزل بالقرب مني صقر كبير، حياني بابتسامة، فأجبته بالتحية نفسها: ● وعليكم السلام، صديقي الصقر، يبدو أنك من بلد بعيد، قطعت مسافات طويلة في طريقك إلي؟! ● أجل، أمرني أخوك السعودي، بأن أحضر إلى بلدك؛ لآخذك معي إلى دولتنا.`,q:[
[5,"الصقر طائر غير عاقل، ولكنه ينطق ويتحاور في النص مع سامي. من أنطقه؟",["خيال سامي","الله الذي أنطق كل شيء","أحلام اليقظة","أخو سامي"],0],
[0,"تصنف كلمتي (القرب - بعيد) في النص السابق حسب معناهما أيهما من:",["الكلمات المترادفة","الكلمات التي بينها اشتمال","الكلمات المتضادة","الكلمات التي لا علاقة بينها في المعنى"],2],
[5,"(استمر طلال على وعده، يقرأ القصص، ويلعب في الوقت المحدد، ويذاكر بجد واجتهاد، وانعكس ذلك على دراسته وصحته) نهاية القصة تشير إلى:",["نجاح طلال","تحسن أحوال طلال عامة","شفاء عين طلال","تدهور أحوال طلال عامة"],1],
[5,"(لقد علمتني يا أبي أن أراقب الله عز وجل، وسأظل على ذلك ما ربيتني عليه من أخلاق فاضلة، مع من عرفت ومن لم أعرف في ذلك الفضاء الواسع، وكذلك تفوقي الدراسي لن يتأثر بإذن الله، لكني أحب اللعب على الحاسوب، وأنا ماهر في ألعابه وبرامجه) المهارة الخفية التي برع فيها طلال:",["الألعاب الحاسوبية","القراءة من الحاسوب","البرامج الحاسوبية","الألعاب والبرامج الحاسوبية"],3],
[5,"الفيصل يفتتح معرض جدة الدولي للكتاب بمشاركة ٤٢ دولة و٥٠٠ دار نشر. افتتح مستشار خادم الحرمين الشريفين، أمير منطقة مكة المكرمة الأمير خالد الفيصل آل سعود مساء اليوم معرض الكتاب الدولي في جدة ٢٠١٧م، خلال الفترة من ١٤-٢٤ ديسمبر الجاري. وفي التفاصيل، قام مستشار خادم الحرمين، الأمير خالد الفيصل آل سعود بتكريم الشاعر الراحل إبراهيم خفاجي، إضافة إلى ست شخصيات تقديرا لدورهم الكبير في صناعة التأليف والكتاب وقضايا الكتاب والنشر. ما سبق يسمى خبرا صحفيا بسبب:",["الأحداث والمعلومات الحقيقية التي تتعلق بشخصية أو أكثر وترتبط بمكان وزمان محددين","الأحداث والمعلومات تعتمد على الرأي وتتعلق بشخصية معينة وترتبط بمكان وزمان محددين","الأحداث والمعلومات حقيقية لا تتعلق بشخصية أو أكثر ولا ترتبط بمكان وزمان محددين","الأحداث والمعلومات تعتمد على الرأي ولا تتعلق بشخصية معينة ولا ترتبط بمكان وزمان محددين"],0],
[5,"(لاحظت الأم تعلق ولدها بجهاز الحاسوب، فخصصت له ساعة واحدة من أجل اللعب، ولكنه لم يلتزم بذلك، وكلما نادته أمه تشاغل عنها ولم يستجب لنصائحها الكثيرة عن أضرار الجلوس الطويل أمام شاشة اللعب، ازداد قلق الأم، فحدثت زوجها بمخاوفها من أن يصاب ابنها بالعزلة والانطواء أو تصاب عيناه بالمرض) سبب احمرار عيني طلال:",["اللعب على جهاز الحاسوب","كثرة قراءة القصص الملونة","طول القراءة من الكتاب","الاستغراق أمام شاشة التلفزيون"],0]]},
20:{t:`في قرية هادئة تقع على ضفاف نهر صاف، كانت تعيش سيدة تدعى فاطمة. كانت فاطمة تتمتع بمهارة في الخياطة، حيث كانت تصنع أجمل الأثواب لنساء القرية. لم تكن موهبتها مقتصرة على الإبرة والخيط فقط، بل كانت تمتلك عينا فنية تجعل من كل قطعة قماش تحفة فنية. كانت فاطمة تؤمن بأن الملابس ليست مجرد أقمشة، بل تعبير عن الشخصية والهوية. في موسم الأعياد، قررت فاطمة أن تقيم معرضا صغيرا تعرض فيه أعمالها، وتخصص جزءا من الأرباح لمساعدة الأسر المحتاجة في القرية. حضر المعرض عدد كبير من أهل القرية الذين أشادوا بعملها، وبفضل مبادرتها النبيلة، تمكنت فاطمة من جمع تبرعات ساعدت العديد من الأسر، وأصبحت مثالا يحتذى به في العطاء والمشاركة المجتمعية.`,q:[
[9,"من هي فاطمة وما الذي يميزها؟",["فاطمة سيدة تحب القراءة","فاطمة خياطة ماهرة تقيم معرضا لأعمالها","فاطمة سيدة تقيم معارض للأزياء","فاطمة خياطة ماهرة تسعى لمساعدة المجتمع من خلال عملها"],3],
[9,"نوع النص هو:",["مقال","قصة","حوار","سيرة"],1],
[8,`المغزى الذي يهدف إليه الكاتب في قوله: "تخصص جزءا من الأرباح لمساعدة الأسر المحتاجة في القرية" هو:`,["يشير إلى أهمية العمل الخيري","يظهر مهارة فاطمة في الخياطة","يبرز دور الفن في تحسين المجتمع","يشير إلى أن العمل يمكن أن يكون وسيلة لدعم الآخرين"],3],
[2,"قارن بين مهارة فاطمة في الخياطة ودورها في المجتمع كما ورد في النص:",["مهارة فاطمة في الخياطة تقتصر على الإبرة والخيط فقط، بينما دورها في المجتمع يقتصر على البيع فقط","مهارة فاطمة في الخياطة تشمل التعبير عن الشخصية، بينما دورها في المجتمع هو تنظيم معارض فنية","مهارة فاطمة في الخياطة تقتصر على صناعة الأثواب الجميلة، بينما دورها في المجتمع يشمل المساعدة والعطاء","مهارة فاطمة في الخياطة تتعلق بالبراعة الفنية، بينما دورها في المجتمع يركز على جمع التبرعات والتبرع بها"],2],
[9,"الغرض/غرض الكاتب من النص هو:",["إظهار أهمية المهارة في العمل","تسليط الضوء على دور العطاء في المجتمع","أهمية المعارض الفنية","تقديم الشكر لأهل القرية"],1]]},21:{t:"يشبه فمك ساحة الحرب! العدو هو رسابة الأسنان، وهي مادة بيضاء تتراكم على أسنان كل شخص، تتغذى ببقايا الطعام في فمه، وهي تهاجم بطريقتين: الأولى تدمير الطبقة الخارجية للسن، بصب مواد حمضية عليها، والثانية صب سموم على اللثة. عليك بفرشاة الأسنان، فهي سلاح ذو حدين، إن لم تحسن استخدامه، ساعدت به العدو. اطلب إلى طبيب الأسنان أن يشرح لك كيفية الاستخدام جيدا. حرك الفرشاة في حركة كاشطة قصيرة ودائرية لتنظف أسنانك من الخارج، ثم حرك الفرشاة إلى أعلى وإلى أسفل لتخلص الفجوات بينها من الرسابة. لا تحركها إلى الأمام وإلى الخلف كي لا تؤذي لثتك. امنع عودة الرسابة بتنظيف جميع جوانب أضراسك وقواطعك يوميا.",q:[
[9,"وصف الكاتب رسابة الأسنان بأنها:",["صديق الإنسان","عدو الأسنان","مشكلة دائمة","مرض معد"],1],
[9,"العلاقة بين (أعلى – أسفل):",["ترادف","تشابه","تضاد","مفرد وجمع"],2],

[3,"(إنك بحاجة إلى أسنان سليمة طوال حياتك):",["رأي","تعجب","حقيقة","خيال"],2],
[1,"يقصد الكاتب بسلاح ذو حدين:",["الجانب الإيجابي فقط","الجانب الإيجابي والجانب السلبي","الجانب السلبي فقط","السلاح القاطع"],1]]},22:{t:"قال أحمد: قضيت ليلة أمس أنتظر عودة أمي التي ذهبت بصحبة أبي إلى المستشفى؛ لتضع مولودها الجديد، وفي الصباح نبهني من نومي صوت خيل إلي أني كنت أسمعه منذ مدة، دقت الباب، واستأذنت، ثم دخلت. كانت أمي تحمل بين ذراعيها ذلك المولود الذي انتظرناه طويلا، كانت عيناها مشرقتين على الرغم من الإعياء الذي يبدو على محياها. بادرتها القول: حمدا لله على سلامتك يا أمي. سلمك الله يا بني. تعال انظر إلى أخيك الصغير، إنه يشبهك، لقد سميناه خالدا كما كنت تريد. اقتربت رويدا رويدا، أمعنت النظر في المولود، يا الله ما أجمله جسم ضئيل، عينان صغيرتان، يدان طريتان، حركات غير مركزة، رغبت في معانقته غير أني تذكرت أن ذلك قد يعرضه للخطر، وبسرعة جنح بي الخيال بعيدا لأراه لاعبا في حديقة المنزل، أو ممسكا كتابه، أو واقفا إلى جانبي في الصلاة، حمدت الله، وشكرته، لقد أصبح لي أخ، أصبح لي من سيقف إلى جانبي في معركة الحياة، وسأكون بعون الله خير مساعد له، وخير نصير. وبعد مدة جلسنا حول مائدة الإفطار، كانت السعادة تغمر الجميع، كانت سعادة مضاعفة، إنها السعادة بسلامة والدتي، والسعادة بقدوم أخي الصغير، ولم أر والدي قط بمثل ما رأيته اليوم، إنه يشعر بكرم الله وعطائه، وتتجلى هذا الشعور في تعابير الحمد والثناء على الله الواهب الكريم. وقبل أن نبدأ بتناول الفطور سمى أبي الله وحمده، ثم قال: أتاكم اليوم ضيف صغير، ومن حقه علينا جميعا إكرامه ورعايته، وتربيته التربية الصالحة، إنه نبتة صغيرة، وسيصبح بفضل الله ثم بتعاونكم شجرة قوية باسقة تزيد وطننا قوة ورفعة، فحمدا لله على نعمائه وفضله، بارك الله لنا في هذا المولود.",q:[

[0,"الجملة التي فيها كلمة مشابهة في المعنى لكلمة (محياها) هي:",["جمال المرأة في حياتها","المرأة بدت على طلعتها التعب","المرأة سعيدة في حياتها","وضعت المرأة الحجاب على رأسها"],1]]},23:{t:"القراءة أول وسيلة للتعلم؛ إذ تزيدنا معرفة وثقافة فضلا على أنها تنمي العقل والتفكير، وقد حث الإسلام على القراءة؛ فقد جاء لفظ القراءة في أول نص قرآني أنزل على نبينا محمد صلى الله عليه وسلم؛ فبينما النبي محمد صلى الله عليه وسلم في غار حراء يتعبد الليالي ذوات العدد الفردي يخلو بنفسه ويفكر في خالق الكون أتى إليه ملك كريم وضمه إليه وقال له: اقرأ. فوجئ النبي صلى الله عليه وسلم وتعجب لطلبه: فهو أمي لا يقرأ فقال له: ما أنا بقارئ وكرر الملك ذلك ثلاث مرات، وفي المرة الثالثة قال لمحمد صلى الله عليه وسلم: (اقرأ باسم ربك الذي خلق). ونجد هذا الاهتمام أيضا في عصر النبوة، ولا أدل على ذلك من موقف الرسول صلى الله عليه وسلم من أسرى بدر من المشركين؛ إذ كان الرسول يطلب من الأسير المشرك الذي يعرف القراءة والكتابة أن يفدي نفسه ويكسب حريته؛ وذلك بأن يعلم القراءة والكتابة عشرة من المسلمين الذين لا يعرفون القراءة والكتابة. وللقراءة أنواع منها القراءة الجهرية التي يقرأ فيها القارئ المكتوب بصوت مسموع، والقراءة الصامتة وتكون من خلال المتابعة البصرية للمكتوب دون نطق الألفاظ، والقراءة الأدبية، وقراءة التمشيط. القراءة من أهم العمليات العقلية التي قد يستفيد منها الإنسان في وقت قصير جدا، كما أن القراءة تجعل من المجتمع مجتمعا واعيا؛ فالشخص القارئ يعرف جيدا كيف ينتقد ويسمع الانتقاد، وكذلك يفهم وجهة نظر الآخرين، ويستطيع التعبير عن وجهة نظره الشخصية دون الحاجة إلى رفع صوته أو العنف، فالقراءة تغير أسلوب الحياة بالنسبة للبشر؛ لأنه من خلالها يحدث نوع من التأمل وإعمال الذهن والعقل والحواس البشرية ككل، ومن هذا المنطلق يبدأ الإنسان في السيطرة على ذاته من خلال القراءة والمعرفة والوعي.",q:[

[9,"جعل النبي صلى الله عليه وسلم فداء الأسير أن يعلم القراءة ......... من الصحابة:",["واحدا","ثلاثة","خمسة","عشرة"],3],
[9,"نزل الوحي على النبي صلى الله عليه وسلم في:",["غار ثور","غار حراء","جبل أحد","المدينة المنورة"],1]]},24:{t:"تنمو الشعاب المرجانية في المياه الصافية غير العميقة، حيث تجد الظروف المثالية للضوء ودرجة الحرارة التي تمكنها من الازدهار، هذه البيئة الفريدة تتيح للشعاب تكوين مستعمرات كثيفة ومعقدة، مما يجعلها تبدو كحدائق طبيعية تحت الماء، ولهذا السبب يطلق عليها «الحدائق المائية». الشعاب المرجانية معروفة بجمال ألوانها، التي يأتي إليها الناس من مختلف بلدان العالم، كما لها أهمية كبيرة في الحفاظ على البيئة بالإضافة إلى أنها مسكن لعدد ضخم من الكائنات البحرية كالطحالب والقشريات والأسماك التي تعتبر مصدرا رئيسا في استخلاص أدوية لعلاج كثير من الأمراض. لكن خلال السنوات الماضية تضاءلت الشعاب المرجانية بشدة؛ بسبب التغيرات المناخية، وإلقاء مخلفات المصانع في مياه البحار والمحيطات، الذي تسبب في موت الكثير من تلك الكائنات، بالإضافة للصيد الجائر باستخدام مواد متفجرة؛ الذي أدى إلى تدمير أجزاء كبيرة من تلك الشعاب. لهذا انطلقت مبادرة السعودية الخضراء التي أعلن عنها ولي العهد سمو الأمير محمد بن سلمان لمواجهة التغيرات المناخية ورفع مستوى الوعي البيئي بما يعود بالفائدة على الإنسان وبيئته.",q:[

[9,"موضوع النص هو:",["أهمية الشعاب المرجانية","التغيرات المناخية","التحديات البيئية","أهمية الكائنات البحرية"],0]]},25:{t:"طلبت الأم من صغيرها سالم الذهاب للمتجر لشراء بعض البيض لتعد لهم الحلوى التي يحبها سالم كثيرا. خرج سالم مسرعا لشراء البيض وفي الطريق قابله جاره سعيد، فأخبره سعيد أنه متجه لنفس المتجر لشراء بعض حاجات داره. سارا معا حتى وصلا للمتجر واشترى كل منهما حاجته، ثم عادا معا، وفي أثناء عودتهما لم ينتبه سالم إلى الحفرة الصغيرة في الطريق فتعثرت قدماه وسقط أرضا وتكسر البيض كله، أخذ سالم يبكي بحرقة لأنه لم ينتبه للطريق فتسبب في كسر البيض، بينما حاول سعيد أن يهدئه دون فائدة. ماذا سأقول لأمي؟! التي ائتمنتني على الذهاب لشراء البيض، ستغضب كثيرا وربما ستعاقبني. ماذا سأقول لها كي تغفر لي وتسامحني؟! ارتسمت علامات التفكير على وجه سعيد قبل أن يقول: «سأخبرك بفكرة رائعة لتنجو من العقاب: أخبر أمك أن النقود سقطت منك وأنك بحثت عنها فلم تجدها». لم يتقبل سالم تلك الفكرة مطلقا! هل أكذب لأنجو من عقاب أمي؟! وماذا عن عقاب الله؟! ولكن سعيدا أخذ يزين له الفكرة ويخبره أنها كذبة بيضاء لا تضر. افترق الصديقان واتجه كل منهما لداره، وما إن وصل سالم للدار وطرق الباب حتى فتحت أمه تأملته الأم قليلا مندهشة من ثيابه المتسخة، سألته عن البيض، تردد قليلا، هل ينفذ خطة سعيد ويكذب؟ أم يخبرها بالحقيقة؟ وفجأة ارتمى سالم في حضن أمه ومن بين دموعه المنهمرة أخذ يخبرها بكل ما حدث، وهنا احتضنته أمه بشدة وقالت له في حنان: «حمدا لله أنك لم تكذب، سأعطيك نقودا أخرى لتذهب لشراء البيض وسأعد لك الحلوى التي تحبها».",q:[
[2,"النتيجة التي ترتبت على اختيار سالم الصدق في القصة:",["سالم عوقب بشدة من قبل والدته","سالم حصل على دعم والدته وشعر بالراحة لصدقه","سالم فقد ثقة والدته ولم يحصل على البيض","سالم لم يعد يحب الحلوى التي تصنعها والدته"],1],
[2,"قارن بين موقف سالم وموقف سعيد في القصة:",["سالم تجاهل العواقب بينما سعيد فكر في العواقب بشكل جيد","سالم شعر بالندم بعد قراره، بينما سعيد كان راضيا عن اقتراحه","سالم اختار الكذب لتجنب العقاب، بينما سعيد اختار الصدق","سالم اختار الصدق وواجه العواقب، بينما سعيد اختار الكذب كحل سهل"],3],

[3,"ما رأيك في قول سالم: «وماذا عن عقاب الله؟!»؟",["تعبير يدل على تساؤل سالم فقط","تعبير يدل على خوف سالم من سعيد","تعبير يدل على رفض سالم لفكرة سعيد","تعبير يدل على مراقبة سالم لنفسه وخوفه من عقاب الله"],3],
[3,"ما رأيك في الأسلوب الذي كتب به النص:",["التفكك وعدم الترابط","التسلسل والوضوح وترابط الأفكار","صعوبة الألفاظ، وعدم وضوح المعنى","الغموض في بعض عباراته"],1]]},26:{t:"الطقس شديد البرودة، والشتاء يقترب، والعصافير قد هاجرت إلى البلاد الحارة لتنعم بالدفء، لكن عصفورا صغيرا مكسور الجناح لم يستطع الطيران مع أصحابه العصافير الذين تركوه وغادروا، فبقي وحيدا يبحث عن مكان يحتمي فيه من برد الشتاء، وبعد محاولات في الطيران من الطائر ذي الجناح المكسور وصل أخيرا إلى غابة كبيرة، راح يبحث بين أشجارها عن مكان دافئ يقضي فيه فصل الشتاء، مشى الطائر بجناحه المكسور حتى وصل إلى شجرة جوز ضخمة، فتوقف وخاطبها قائلا: أيتها الشجرة الضخمة، هل تقبليني بين أغصانك إلى الربيع المقبل؟ أجابته: نعم، واختر الغصن الذي يعجبك واجعله مسكنك الخاص. فرح العصفور كثيرا، وصنع له بيتا يقيه برودة الشتاء، وشيئا فشيئا شفي جناحه وتعافى وأصبح قويا. وفي الربيع رجع العصفور إلى موطنه، وانضم إلى أصدقائه بعد عودتهم من البلاد الدافئة ولكنه أصبح أكثر حذرا على صحته.",q:[

[4,"من صفات العصفور:",["متواكل","خائف","واثق معتمد على نفسه","جبان"],2],

[4,"الترتيب الصحيح للأحداث في النص هو:",["العصفور يبني بيتا في الشجرة؛ الشجرة توافق على استضافته؛ العصفور يشفى ويعود إلى موطنه؛ العصفور يصل إلى الغابة","الشجرة توافق على استضافته؛ العصفور يصل إلى الغابة؛ العصفور يبني بيتا في الشجرة؛ العصفور يشفى ويعود إلى موطنه","العصفور يصل إلى الغابة؛ العصفور يبني بيتا في الشجرة؛ الشجرة توافق على استضافته؛ العصفور يشفى ويعود إلى موطنه","العصفور يصل إلى الغابة؛ الشجرة توافق على استضافته؛ العصفور يبني بيتا في الشجرة؛ العصفور يشفى ويعود إلى موطنه"],3]]},27:{t:"حلم كان يراود أهالي محافظة العلا التي تقع شمال غرب المملكة العربية السعودية، لسنوات طويلة أن تصبح محافظتهم وجهة سياحية عالمية يقصدها السياح من مختلف دول العالم، تحقق ذلك الحلم بعد الاهتمام والعناية التي أولتها القيادة الرشيدة -رعاها الله- لمدينة العلا. أصبحت العلا واحدة من أبرز وأهم الوجهات السياحية العالمية؛ إذ تحتضن مواقع أثرية ونقوشا صخرية تعود إلى العصور الحجرية القديمة، فهي تعد أكبر متحف حي في العالم؛ لما تحويه من آثار ومدافن ومنحوتات وتشكيلات صخرية، وفيها كذلك منطقة «الحجر النبطية القديمة»، التي سجلت بوصفها أول موقع تراث عالمي لليونسكو في المملكة، ومنطقة «دادان» التي تتميز بمعالمها المحفورة في الجبال والمواقع المحيطة. كما تتميز العلا بمناظرها الطبيعية الخلابة، وجبالها الشاهقة، وودياتها العميقة. وفي عام ٢٠١٧ صدر الأمر الملكي بإنشاء هيئة ملكية في محافظة العلا، وقد شرعت الهيئة منذ تأسيسها في تنفيذ خطة طويلة المدى؛ لتطوير المحافظة وتحقيق التحول المستدام. وتعكس «رؤية العلا» التي أطلقها سمو ولي العهد سابقا، مكانة العلا التاريخية، حيث يعد مخطط «رحلة عبر الزمن»، إحدى المراحل الأساسية لتحقيق رؤية العلا لتصبح أكبر متحف حي بالعالم كما يهدف إلى المحافظة على العلا كبيئة طبيعية وثقافية فريدة من نوعها تسهم في تطوير إرث ثقافي للعالم، تحقيقا لمستهدفات رؤية المملكة ٢٠٣٠، حيث ستحقق مع اكتمالها مردودا اقتصاديا؛ من خلال جذب مزيد من السياح، وتوفير فرص عمل متنوعة لأفراد المجتمع المحلي، بالإضافة إلى المساهمة في الناتج المحلي الإجمالي للمملكة.",q:[

[2,"كيف ترتبط رؤية العلا برؤية المملكة ٢٠٣٠؟",["كلاهما يهدف إلى المحافظة على البيئة","كلاهما يركز على الاقتصاد المحلي","كلاهما يهدف إلى جذب السياح وتطوير الإرث الثقافي","كلاهما يركز على تطوير البنية التحتية"],2],
[2,"ما هي أوجه التشابه بين العلا ومدينة سياحية أخرى تشتهر بالتراث الثقافي؟",["كلاهما يركز على السياحة البيئية","كلاهما يحتوي على مواقع أثرية تعود للعصور القديمة","كلاهما يعتمد بشكل رئيس على الزراعة كمصدر دخل","كلاهما يتميز بوجود شواطئ ساحلية"],1]]},28:{t:"ولد أبو الريحان البيروني في مدينة خوارزم (المعروفة اليوم بأوزبكستان) في سنة ثلاثمائة واثنين وستين للهجرة، في فترة شهدت ازدهارا في العلوم المتنوعة، برع في الرياضيات والفلك والفيزياء والجغرافيا والعلوم الطبيعية، واطلع على أعمال العلماء السابقين. كان البيروني مرجعا في علم الجغرافيا، حيث ابتكر طريقة لحساب محيط الأرض بدقة من خلال قياسات زوايا الشمس من مواقع مختلفة. أظهرت هذه الطريقة فهمه العميق للفلك والجغرافيا، مما جعله محل تقدير في عصره. درس البيروني أيضا ظاهرة المد والجزر، وقدم تفسيرا يعتمد على جاذبية القمر، مما يعتبر سبقا علميا هاما. توفي البيروني في عام ٤٤٠ هجرية، تاركا إرثا علميا أثر في العلماء في العالم الإسلامي وأوروبا.",q:[

[5,"دليل من النص على أن النهضة الحديثة هي امتداد لجهود العلماء السابقين:",["براعة البيروني في الرياضيات والفلك والفيزياء والجغرافيا والعلوم الطبيعية أدت إلى النهضة الحديثة","الفترة التي عاش فيها البيروني شهدت ازدهارا في العلوم المتنوعة انعكس على عصرنا الحاضر","البيروني كان مرجعا في علم الجغرافيا مما أثر ذلك على النهضة الحديثة","إسهامات البيروني في حساب محيط الأرض ودراسة ظاهرة المد والجزر وضعت أسس العلم الحديث"],3],
[3,"ما رأيك في قيمة الاجتهاد والبحث العلمي التي تجسدت في شخصية البيروني؟ علل لرأيك.",["قيمة مبالغ فيها، لأن التطورات التكنولوجية الحديثة هي الأهم في الوقت الحالي","قيمة ثانوية لا تؤثر كثيرا على التقدم العلمي، لأن الاكتشافات تحدث بالصدفة","قيمة أساسية تساهم في تقدم العلوم والمعرفة، لأنها تعتمد على المنهج العلمي والاكتشافات المهمة","قيمة غير مهمة، لأن التركيز يجب أن يكون على النتائج العملية فقط وليس على البحث والاجتهاد"],2],
[3,"كيف يمكن أن نطبق أسلوب البيروني في حياتنا اليومية؟",["بالاعتماد فقط على الآراء الشخصية دون إجراء تجارب","بالتفكير المنظم عند حل المشكلات","بتجاهل الاستكشاف وعدم السعي لفهم الظواهر","بالتوقف عن التعلم وعدم تطبيق المعرفة عمليا"],1]]},29:{t:"في غابة نائية تعيش فيها العديد من الحيوانات، كان هناك دب معروف بكسله الشديد، حيث يقضي معظم وقته مستلقيا تحت شجرة كبيرة يستمتع بظلالها الوارفة. كانت هذه الشجرة مكانه المفضل للتأمل والراحة، حيث يستمع إلى تغريد الطيور ويمتع نظره بالخضرة المحيطة. هذا الدب كان مولعا بالعسل، ومع أن بصره ضعيف، كان يتمتع بحاسة شم قوية تساعده في العثور على خلايا النحل المنتشرة في الغابة. وبينما كان الدب يسترخي كعادته في أحد الأيام، جلبت له الرياح رائحة عسل لذيذ. قادته حاسة الشم القوية نحو خلية نحل ضخمة معلقة على أحد الأغصان. بدأ الدب الكسول في التهام العسل بشراهة، غير مكترث بالنحل الذي بدأ بالتحليق حوله غاضبا. أثار هذا الفعل غضب النحل، وقررت الملكة نقل الخلية بعيدا عن مكان الدب حتى تتجنب إزعاجه المستمر. في الصباح التالي، استيقظ الدب وشعر بالجوع، وبدأ في البحث عن العسل لكن دون جدوى. وبينما كان يتجول في الغابة، صادف ذئبا بدا عليه الفضول. سأله الذئب إلى أين هو ذاهب في هذه الساعة المبكرة. أجاب الدب بتذمر أنه ذاهب إلى البحيرة لصيد السمك علّه يجد ما يسد جوعه بعد اختفاء العسل. عند وصوله إلى البحيرة، حاول مرارا وتكرارا أن يصطاد سمكة باستخدام مخالبه الكبيرة، ولكن لم ينجح في ذلك. سخرت منه سمكة صغيرة قائلة إنه لن يتمكن من الصيد بالضفة وأن عليه الدخول إلى الماء للحصول على فريسته. شعر الدب بالغضب من تعليق السمكة، وقفز إلى الماء دون أن يدرك مدى عمقه، ولحسن حظه وبينما كان يكافح للسباحة تمكن من الإمساك بجذع شجرة طافية ونجا بنفسه.",q:[

[6,"يمكن اقتراح نهاية إيجابية للدب في النص بما يأتي:",["قرر الدب أن يهاجر إلى غابة أخرى حيث يوجد المزيد من خلايا النحل، وترك الغابة التي عاش فيها طوال حياته","تعلم الدب من تجربته مع البحيرة وقرر أن يطور مهاراته في الصيد بمساعدة الحيوانات الأخرى، مما جعله أكثر استقلالية في تأمين طعامه","شعر الدب بالإحباط وقرر ألا يحاول مرة أخرى البحث عن الطعام بنفسه، معتمدا على الصدفة لتوفير غذائه","استسلم الدب لكسله وعاد إلى النوم تحت الشجرة دون محاولة تحسين وضعه أو البحث عن طعام بديل"],1]]},30:{t:"النمل هو من أكثر المخلوقات التي تذهل العلماء والباحثين بسبب تنظيمه الاجتماعي الفريد وتنوع أنواعه، حيث يوجد أكثر من ١٢,٠٠٠ نوع معروف في مختلف أنحاء العالم. تعتبر مستعمرات النمل من أعقد المجتمعات الحيوانية، حيث تتراوح أحجامها من بضع عشرات من الحشرات إلى ملايين الأفراد، وتعمل كل مستعمرة كوحدة متناغمة تتميز بالتعاون والتنسيق بين الأفراد. تلعب الأدوار المختلفة داخل المستعمرة دورا حيويا في استمرارية الحياة وتحقيق الأهداف الجماعية. النمل العامل، على سبيل المثال، هو المسؤول عن مجموعة واسعة من المهام التي تشمل جمع الغذاء من مصادر متنوعة قد تبعد أحيانا عدة كيلومترات عن المستعمرة، ورعاية الصغار من خلال توفير الغذاء والعناية اللازمة، كما يعمل على توسيع المستعمرة بإنشاء أنفاق جديدة ومناطق معيشة إضافية. من ناحية أخرى، تلعب الملكة دورا مركزيا في المستعمرة، حيث تعتبر المسؤولة الوحيدة عن وضع البيض، مما يضمن استمرار الأجيال القادمة واستدامة المستعمرة. في حين أن الذكور، غالبا، يكون دورهم محدودا في التزاوج مع الملكة ومن ثم يموتون بعد فترة قصيرة. التواصل بين أفراد النمل يعد من أكثر الجوانب المثيرة للاهتمام، حيث يستخدم النمل الفيرومونات كوسيلة أساسية لإرسال واستقبال الإشارات. هذا النظام يشبه إلى حد كبير أنظمة الاتصال المعقدة في المجتمعات البشرية، وهو ما يمكن النمل من نقل المعلومات الحيوية حول مواقع الغذاء، أو التحذير من الأخطار المحتملة، أو حتى تنظيم حركة المرور داخل وخارج المستعمرة. علاوة على ذلك، يظهر النمل قدرة مذهلة على التكيف مع بيئات متنوعة، من الغابات المطيرة الرطبة إلى الصحاري الجافة القاحلة. هذه القدرة والمرونة تعد من العناصر الأساسية التي تساهم في بقاء النمل ونجاحه في مواجهة التغيرات البيئية والتحديات الطبيعية. كما أن النمل يظهر سلوكيات تعاونية مذهلة عند مواجهة الكوارث أو التهديدات الخارجية، مثل بناء جسور حية بأجسادهم لعبور المياه أو التضاريس الصعبة.",q:[
[7,"من خلال المعلومات الواردة في النص، كيف يمكنك إقناع الآخرين بأن (التواصل الفعال هو عنصر أساسي لتحقيق النجاح في المجتمعات)؟",["التواصل الفعال يساعد النمل على العمل بشكل فردي دون الحاجة للتعاون","التواصل الفعال يمكن النمل من توجيه الجهود الجماعية بشكل منظم وفعال","التواصل الفعال يجعل النمل يعتمد على الحظ في العثور على الغذاء","التواصل الفعال لا يؤثر على كفاءة المستعمرة"],1],
[7,"ما هي الحجة الأكثر إقناعا لدعم أهمية التخصص الوظيفي في مجتمع النمل؟",["التخصص يؤدي إلى كفاءة عالية في أداء المهام، لأن كل نملة تقوم بعمل محدد تتقنه، مما يزيد من كفاءة المستعمرة ككل","التخصص يساعد النمل على التركيز على المهام المحددة، مما يؤدي إلى تحسين الجودة في العمل","التخصص يتيح للنمل تنظيم العمل بشكل أفضل، مما يسهل تحقيق الأهداف المشتركة بسرعة","التخصص يعزز التعاون بين النمل، لأن كل فرد يعرف دوره ويعتمد على الآخرين لأداء مهامهم بكفاءة"],0],
[7,"أي من هذه الأمور هو الأهم لبقاء النمل معا؟ ولماذا؟",["التكيف، لأن التكيف يساعد النمل على العيش في بيئات مختلفة وتجاوز التحديات","التخصص، لأن التخصص يجعل كل نملة تقوم بدور معين، مما يزيد من كفاءة المستعمرة","التعاون، لأن التعاون يساعد النمل على العمل معا بشكل منظم، مما يجعلهم يجمعون الغذاء ويبنون مستعمراتهم بنجاح، وبالتالي يضمن بقاءهم معا","لا شيء منها مهم، لأن النمل يستطيع البقاء معا بدون الاعتماد على أي من هذه الأمور"],2]]},31:{t:"إعادة التدوير تعني تحويل النفايات والمواد غير المستخدمة إلى منتجات جديدة يمكن استعمالها مجددا، وهي جزء مهم من إدارة النفايات التي تسهم في الحفاظ على البيئة، من خلال تقليل استهلاك الموارد الطبيعية وتقليص حجم النفايات في المكبات، تسهم إعادة التدوير بشكل كبير في حماية البيئة. هناك فوائد عديدة لإعادة التدوير، منها الحفاظ على الطاقة وتقليل انبعاثات الكربون. فعلى سبيل المثال، إعادة تدوير الورق تساعد في الحفاظ على الأشجار وتقليل استهلاك المياه والطاقة في عملية تصنيع الورق الجديد. كذلك، إعادة تدوير المعادن مثل الألمنيوم توفر كمية كبيرة من الطاقة مقارنة بإنتاج الألمنيوم من خاماته الأصلية. تتنوع المواد التي يمكن إعادة تدويرها، وتشمل البلاستيك، والورق، والزجاج، والمعادن. كل مادة تتطلب عملية خاصة لإعادة التدوير. ويحتاج البلاستيك إلى التنظيف والفرز قبل إعادة تشكيله، بينما يمكن إعادة تدوير الزجاج بسهولة عبر صهره وإعادة تشكيله من جديد. في النهاية، تمثل إعادة التدوير خطوة مهمة نحو تحقيق الاستدامة البيئية. من خلال زيادة الوعي والتثقيف حول أهمية إعادة التدوير، يمكن للأفراد والمجتمعات أن تلعب دورا فعالا في الحفاظ على كوكبنا للأجيال القادمة، وبعد الاستثمار في تقنيات إعادة التدوير المتطورة جزءا أساسيا من هذا الجهد الجماعي.",q:[

const IB=[["منطقة جازان · أرخبيل فرسان","تقع في الجزء الجنوبي من أرخبيل فرسان، وتشتهر بوفرة اللؤلؤ قديمًا وبالأسماك المتنوعة حاليًا."],["منطقة تبوك · البحر الأحمر","تشتهر بالفيلات العائمة المستديرة المصنوعة من الفولاذ المقاوم للصدأ، وتضم شعابًا مرجانية ممتدة وعميقة تجعل الغوص فيها تجربة فريدة."],["منطقة جازان · أرخبيل فرسان","ثاني أكبر جزر أرخبيل فرسان (حوالي 150 كم²)، وتتميز بغابات المانغروف الكثيفة والشواطئ الرملية البيضاء ومزارع النخيل."],["منطقة تبوك · البحر الأحمر","جزيرة بكر ساحرة يجري تطويرها لتضم منتجعات فائقة الفخامة، وتتميز بمياهها الفيروزية الصافية المناسبة للغوص."],["الخليج العربي","جزيرة نائية صغيرة جدًا في المياه العميقة للخليج العربي، وهي محمية طبيعية صارمة ومحطة هامة لراحة الطيور البحرية المهاجرة."],["منطقة جازان","جزيرة صغيرة وهادئة تتميز بشواطئها الرملية الناعمة وموقعها المناسب للراحة."],["المنطقة الشرقية · الجبيل","أكبر الجزر السعودية في الخليج العربي (حوالي 59 كم²)، ترتبط باليابس بجسر بري، وتضم منشآت نفطية هامة ومحميات بيئية لأشجار القرم."],["منطقة تبوك · خليج العقبة","جزيرة استراتيجية هامة عند مدخل خليج العقبة، تتميز بتضاريسها الجبلية المرتفعة والشعاب المرجانية العميقة المحيطة بها."],["منطقة تبوك · البحر الأحمر","الجزيرة الرئيسية في وجهة البحر الأحمر السياحية الفاخرة، صُممت على شكل دولفين، وتضم منتجعات فاخرة وملاعب غولف ومراسي لليخوت."],["محافظة القنفذة","جزيرة بكر ساحرة برمالها البيضاء ومياهها الضحلة الدافئة، وتناسب السباحة الطويلة والاسترخاء."],["محافظة أملج","جزيرة ممتدة تتميز برمالها البيضاء الناعمة ومياهها الضحلة، وتعد من الوجهات المفضلة للاسترخاء والسباحة."],["المنطقة الشرقية","جزيرة رملية منخفضة في المياه الضحلة للخليج العربي، وتعد مقصدًا تقليديًا للصيادين لتبديل الشباك أو الراحة المؤقتة."],["الخليج العربي","جزيرة مرجانية مسطحة وغير مأهولة، وتعتبر من أهم المحميات الطبيعية في الخليج لتعشيش السلاحف البحرية الخضراء، وسلاحف صقرية المنقار، والطيور البحرية."],["الساحل الغربي · شمال البحر الأحمر","جزيرة صغيرة جدًا تقع عند الحدود الشمالية للبحر الأحمر بالقرب من خليج العقبة، وتتميز بطبيعتها الصخرية الصارمة."],["محافظة الوجه","مجموعة من 7 جزر متقاربة رائعة الجمال قبالة الوجه، تتنوع تضاريسها وتعد ملاذًا آمنًا للحياة الفطرية والشعاب المرجانية النادرة."],["محافظة الليث","جزيرة جبلية شهيرة فيها كهوف مائية وتشكيلات صخرية، وتعد من أفضل مواقع الغوص ورؤية أسماك القرش الحوتية في مواسمها."],["منطقة جازان · أرخبيل فرسان","جزيرة غير مأهولة تمتاز بالطبيعة العذراء والشواطئ النظيفة، ويقصدها السياح للاستجمام والتقاط الصور."],["محافظة الوجه","جزيرة تتميز بشكلها الطولي وغطائها النباتي البحري، وتعد بيئة ملائمة لتكاثر الأسماك التجارية المحلية."],["محافظة أملج","جزيرة سياحية جبلية شهيرة مساحتها حوالي 24 كم²، وتعد من أبرز وجهات التنزه البحري والصيد وأنشطة الغوص في أملج."],["منطقة عسير","جزيرة بركانية جبلية بارزة تقع قبالة ساحل القحمة، وفي وسطها جبل صخري شاهق يقصده هواة التسلق ومحبو رصد الطيور المهاجرة."],["المنطقة الشرقية · الدمام","جزيرة صغيرة تقع قبالة سواحل مدينة الدمام، وتتميز ببيئتها الطينية والرملية التي تجذب الطيور الساحلية."],["الخليج العربي","جزيرة رملية منخفضة تحيط بها المياه الفيروزية الضحلة، وتشتهر بنقاء رمالها ونشاط تكاثر السلاحف فيها في مواسم الهجرة."],["المنطقة الشرقية · القطيف","جزيرة تاريخية عريقة مأهولة بالسكان منذ آلاف السنين، مساحتها حوالي 20 كم²، وتضم قلعة تاروت الأثرية والبيوت الشعبية القديمة."],["منطقة عسير · البحر الأحمر","جزيرة في البحر الأحمر تتبع منطقة عسير في جنوب غرب المملكة، مساحتها نحو 3.2 كم² وتبعد عن الساحل حوالي 11.4 ميلًا بحريًا. تمتاز بالمياه الهادئة الشفافة، وهي مكان مثالي لمشاهدة قاع البحر والشعاب المرجانية الملونة من على المركب."],["منطقة جازان · أرخبيل فرسان","من جزر فرسان المميزة، فيها مرتفعات صخرية جيرية وشواطئ ممتازة للسباحة والغوص."],["المنطقة الشرقية","جزيرة استراتيجية تحيط بها شعاب مرجانية غنية ومتنوعة للغاية، وتعد من أفضل مواقع الغوص في الخليج العربي ومحمية طبيعية هامة للحياة الفطرية."],["منطقة جازان","جزيرة ممتدة وقريبة نسبيًا من مرسى جازان، وهي بيئة ممتازة لنمو أشجار المانغروف (القندل) ومقصد للرحلات البحرية القصيرة."],["منطقة جازان · أرخبيل فرسان","جزيرة مأهولة تشتهر بمهنة الصيد قديمًا وحديثًا، وتضم مياهها كائنات بحرية نادرة، ومعالم تاريخية مثل بيت الجرمل الألماني."],["محافظة ضباء","جزيرة كبيرة الحجم تقع في شمال الساحل الغربي، وتتميز بمرتفعاتها وشواطئها الهادئة المناسبة لرسو المراكب الكبيرة."],["منطقة تبوك · البحر الأحمر","تقع إلى الشرق من جزيرة تيران، وتتميز بالشواطئ الرملية والتكوينات الصخرية، وتعد محطة هامة للطيور البحرية المهاجرة."],["منطقة جازان · أرخبيل فرسان","أكبر الجزر السعودية مساحة (حوالي 380 كم²)، وهي مأهولة بالسكان ومركز أرخبيل فرسان، وتتميز بالآثار التاريخية مثل القلعة العثمانية وقرية القصار، وبمحميات الغزلان ومهرجان الحريد السنوي."]];
